id: irrigation_weather_smart
category: irrigation
tier: pro_only
title:
  uk: Інтелектуальний полив (Прогноз погоди)
  en: Smart Irrigation (Weather Forecast)
description:
  uk: Відміняє запланований полив, якщо очікується дощ.
  en: Cancels scheduled irrigation if rain is forecasted.
form_schema:
  fields:
    - id: enable_telegram
      type: boolean
      required: false
      default: false
      label:
        uk: Надсилати сповіщення в Telegram
        en: Send Telegram Notification
    - id: automation_title
      type: string
      required: true
      default: Розумний полив (Погода)
      label:
        uk: Назва автоматизації
        en: Automation Title
    - id: weather_entity
      type: entity_id
      allowed_domains:
        - weather
      required: true
      label:
        uk: Об'єкт погоди (weather.)
        en: Weather Entity (weather.)
    - id: irrigation_valve
      type: entity_id
      allowed_domains:
        - switch
        - valve
      required: true
      label:
        uk: Клапан поливу
        en: Irrigation Valve
    - id: schedule_time
      type: time
      required: true
      default: 06:00:00
      label:
        uk: Час поливу
        en: Irrigation Time
    - id: duration_minutes
      type: number
      required: true
      min: 1
      max: 60
      default: 20
      label:
        uk: Тривалість поливу (хв)
        en: Irrigation Duration (min)
    - id: telegram_notify_service
      type: string
      required: false
      default: notify.telegram
      label:
        uk: Ім'я notify-сервісу Telegram
        en: Telegram Notify Service
jinja_yaml_template: |-
  alias: "{{ automation_title }}"
  description: "Полив із перевіркою прогнозу погоди."
  mode: single
  trigger:
    - platform: time
      at: "{{ schedule_time }}"
  condition:
    - condition: template
      value_template: "{% raw %}{{ not ('rain' in states('{{ weather_entity }}') or 'rain' in state_attr('{{ weather_entity }}', 'forecast')[0].condition) }}{% endraw %}"
  action:
    - service: switch.turn_on
      target:
        entity_id: {{ irrigation_valve }}
    - delay:
        minutes: {{ duration_minutes }}
    - service: switch.turn_off
      target:
        entity_id: {{ irrigation_valve }}

    {% if enable_telegram %}
    - service: {{ telegram_notify_service }}
      data:
        message: "Спрацювала автоматизація: Інтелектуальний полив (Прогноз погоди)"
    {% endif %}
